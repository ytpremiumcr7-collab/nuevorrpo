name: Import prepared source archive (temporary)

on:
  push:
    branches:
      - prepare/construction-automation-2026-10-22
    paths:
      - construction-automation-candidate-upload.zip
      - .github/workflows/import-candidate.yml

permissions:
  contents: read

concurrency:
  group: archive-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract:
    name: Validate and import archive (no project code execution)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.commit.outputs.source_sha }}
    steps:
      - name: Checkout uploaded archive commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Validate paths and extract source safely
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, re, stat, zipfile
          from pathlib import Path, PurePosixPath

          archive = Path("construction-automation-candidate-upload.zip")
          if not archive.is_file():
              parts = sorted(Path("upload-parts").glob("part-*.b64"))
              if not 10 <= len(parts) <= 40:
                  raise SystemExit(f"unexpected number of base64 parts: {len(parts)}")
              encoded = "".join(p.read_text(encoding="ascii").strip() for p in parts)
              if not re.fullmatch(r"[A-Za-z0-9+/]*={0,2}", encoded) or len(encoded) % 4:
                  raise SystemExit("invalid base64 archive parts")
              archive.write_bytes(base64.b64decode(encoded, validate=True))
          if archive.stat().st_size > 10 * 1024 * 1024:
              raise SystemExit("archive exceeds 10 MiB upload limit")
          root = Path.cwd().resolve()
          forbidden_names = {".env", ".env.local", ".env.production", "id_rsa", "id_ed25519"}
          allowed_exts = {".pem", ".key", ".p12", ".pfx", ".jks", ".keystore", ".dump"}
          with zipfile.ZipFile(archive) as z:
              infos = z.infolist()
              if not infos or len(infos) > 2000:
                  raise SystemExit("empty archive or too many entries")
              if len({i.filename for i in infos}) != len(infos):
                  raise SystemExit("duplicate archive entry")
              if sum(i.file_size for i in infos) > 25 * 1024 * 1024:
                  raise SystemExit("uncompressed archive exceeds 25 MiB")
              files = 0
              for info in infos:
                  name = info.filename
                  if "\\" in name or name.startswith("/") or ":" in name:
                      raise SystemExit(f"unsafe path syntax: {name!r}")
                  rel = PurePosixPath(name)
                  if not name or any(part in ("", ".", "..", ".git", "node_modules", "target", "__pycache__") for part in rel.parts):
                      raise SystemExit(f"unsafe archive path: {name!r}")
                  if rel.name in forbidden_names or rel.suffix.lower() in allowed_exts:
                      raise SystemExit(f"secret/credential-like file not allowed: {name!r}")
                  mode = (info.external_attr >> 16) & 0o170000
                  if mode == stat.S_IFLNK:
                      raise SystemExit(f"symlinks are not allowed: {name!r}")
                  if info.is_dir():
                      continue
                  # The Actions token lacks workflows permission; import workflow files separately.
                  if name.startswith(".github/workflows/"):
                      print(f"Deferred workflow file {name} because Actions token lacks workflows permission")
                      continue
                  if info.file_size > 5 * 1024 * 1024:
                      raise SystemExit(f"individual file too large: {name!r}")
                  out = (root / Path(*rel.parts)).resolve()
                  if root != out and root not in out.parents:
                      raise SystemExit(f"path escapes workspace: {name!r}")
                  out.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(info) as src, out.open("wb") as dst:
                      total = 0
                      while True:
                          block = src.read(1024 * 1024)
                          if not block:
                              break
                          total += len(block)
                          if total > 5 * 1024 * 1024:
                              raise SystemExit(f"expanded file exceeded limit: {name!r}")
                          dst.write(block)
                  files += 1
              if files < 100:
                  raise SystemExit(f"unexpectedly small source tree: {files} files")
          if not Path("pom.xml").is_file() or not Path("src/main/resources/db/migration").is_dir():
              raise SystemExit("archive does not contain the expected Maven application and migrations")
          print(f"Imported {files} files after safe-path validation; project code has NOT been executed in this job.")
          PY
      - name: Commit imported source and remove temporary importer
        id: commit
        shell: bash
        env:
          BRANCH_NAME: prepare/construction-automation-2026-10-22
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f construction-automation-candidate-upload.zip
          git rm -f .github/workflows/import-candidate.yml
          python3 - <<'PY'
          from pathlib import Path
          text_suffixes = {".md", ".java", ".sql", ".yml", ".yaml", ".xml", ".properties", ".sh", ".py", ".json", ".html", ".css", ".js", ".txt", ".dockerignore"}
          for path in Path(".").rglob("*"):
              if not path.is_file() or path.suffix.lower() not in text_suffixes:
                  continue
              try:
                  data = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              cleaned = "\\n".join(line.rstrip() for line in data.splitlines()) + ("\\n" if data.endswith("\\n") else "")
              if cleaned != data:
                  path.write_text(cleaned, encoding="utf-8")
          PY
          git add -A
          git diff --cached --check
          git commit -m "feat: import hardened construction automation candidate"
          git push origin "HEAD:${BRANCH_NAME}"
          source_sha="$(git rev-parse HEAD)"
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
          echo "Imported source SHA: ${source_sha}"

  verify:
    name: Read-only build and integration verification
    needs: extract
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout imported source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.extract.outputs.source_sha }}
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify static controls
        run: |
          java -version
          mvn -version
          docker --version
          bash -n run.sh test.sh scripts/*.sh
          python3 scripts/verify-hardening-static.py
          python3 scripts/verify-workflow-models.py
          bash scripts/prove-construction-niche.sh
      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: ci-only-placeholder-not-a-secret
          SPRING_DATASOURCE_PASSWORD: ci-only-placeholder-not-a-secret
          OUTBOX_DB_PASSWORD: ci-only-placeholder-not-a-secret
          EVIDENCE_HMAC_KEY: ci-only-placeholder-not-a-secret
          CONSTRUCTION_BOOTSTRAP_TOKEN: ci-only-placeholder-not-a-secret
          CAMUNDA_ADMIN_PASSWORD: ci-only-placeholder-not-a-secret
        run: |
          docker compose --env-file .env.example -f docker-compose.yml config --quiet
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.prod.yml config --quiet
      - name: Compile and run all tests including Testcontainers
        run: mvn -B -ntp -DtrimStackTrace=false clean verify
      - name: Collect test and dependency evidence
        if: always()
        shell: bash
        run: |
          mkdir -p target/verification
          mvn -B -ntp dependency:tree -DoutputFile=target/verification/dependency-tree.txt || true
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: import-build-evidence-${{ github.run_id }}
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
            target/verification/**
          if-no-files-found: warn
          retention-days: 14
