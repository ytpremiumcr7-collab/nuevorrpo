global:\n  scrape_interval: 15s\n  evaluation_interval: 15s\n\nscrape_configs:\n  - job_name: construction-automation\n    metrics_path: /actuator/prometheus\n    static_configs:\n      - targets: ['app:8081']\n        labels:\n          service: construction-automation\n    relabel_configs:\n      - source_labels: [__address__]\n        target_label: instance\n        regex: '([^:]+)(?::\d+)?'\n        replacement: '${1}'\n\n# Alertas sugeridas (configurar Alertmanager)\n#\n# - alert: OutboxDeadLetterPresent\n#   expr: outbox_dlq_count > 0\n#   for: 5m\n#   annotations:\n#     summary: "Outbox tiene filas en DEAD_LETTERED"\n#\n# - alert: NoPaymentsInLastHour\n#   expr: increase(billing_payments_executed_total[1h]) == 0\n#   for: 2h\n#   annotations:\n#     summary: "Ningún pago ejecutado en 2h (posible bloqueo silencioso)"