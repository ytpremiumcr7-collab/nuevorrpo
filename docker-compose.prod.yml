# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d\n# Requiere variables en .env (o override con env vars del entorno)\n\nservices:\n  postgres:\n    restart: always\n    ports: []  # NO exponer Postgres en prod\n    command:\n      - "postgres"\n      - "-c"\n      - "max_connections=200"\n      - "-c"\n      - "shared_buffers=512MB"\n      - "-c"\n      - "wal_level=replica"\n      - "-c"\n      - "archive_mode=on"\n      - "-c"\n      - "archive_command='test ! -f /var/lib/postgresql/archive/%f && cp %p /var/lib/postgresql/archive/%f'"\n    volumes:\n      - pgdata:/var/lib/postgresql/data\n      - pgarchive:/var/lib/postgresql/archive\n\n  app:\n    restart: always\n    environment:\n      SPRING_PROFILES_ACTIVE: prod\n      EVIDENCE_HMAC_KEY: ${EVIDENCE_HMAC_KEY:?EVIDENCE_HMAC_KEY required}\n      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?required}\n      SPRING_FLYWAY_ENABLED: "false"\n      CAMUNDA_ADMIN_PASSWORD: ${CAMUNDA_ADMIN_PASSWORD:?required}\n    healthcheck:\n      test: ["CMD-SHELL", "curl -sf http://localhost:8081/actuator/health | grep -q UP"]\n      interval: 30s\n      timeout: 10s\n      retries: 3\n      start_period: 60s\n\nvolumes:\n  pgarchive: