server:\n  port: 8080\n\nspring:\n  datasource:\n    url: ${SPRING_DATASOURCE_URL}\n    username: ${SPRING_DATASOURCE_USERNAME}\n    password: ${SPRING_DATASOURCE_PASSWORD}\n    hikari:\n      maximum-pool-size: 20\n      # Crítico: RLS depende de que la conexión tenga el tenant;\n      # si el pool recicla una conexión con tenant viejo, viola RLS.\n      # El TenantContextFilter lo resetea en finally.\n  flyway:\n    # Fail closed: HTTP runtime must not run schema migrations.\n    # Set SPRING_FLYWAY_ENABLED=true only in isolated integration tests or a dedicated migration job.\n    enabled: ${SPRING_FLYWAY_ENABLED:false}\n    locations: classpath:db/migration\n    baseline-on-migrate: false\n    clean-disabled: true\n    validate-on-migrate: true\n\ncamunda:\n  bpm:\n    database:\n      schema-name: camunda\n    auto-deployment-enabled: true\n    deployment-resource-pattern: classpath*:**/*.bpmn,classpath*:**/*.dmn\n    history-level: full\n\nmanagement:\n  endpoints:\n    web:\n      exposure:\n        include: health,info,metrics,prometheus\n  endpoint:\n    health:\n      show-details: always\n\nlogging:\n  level:\n    com.tuempresa: INFO\n    org.camunda: INFO\n\n# Firma de manifiestos de evidencia (obligatorio en runtime de disputas)\napp:\n  evidence-hmac-key: ${EVIDENCE_HMAC_KEY}\n\nconstruction:\n  auth:\n    allow-user-id: ${ALLOW_X_USER_ID:false}\n  bootstrap-token: ${CONSTRUCTION_BOOTSTRAP_TOKEN:}\n  outbox:\n    worker:\n      enabled: ${OUTBOX_WORKER_ENABLED:false}\n    datasource:\n      url: ${OUTBOX_DATASOURCE_URL:}\n      username: ${OUTBOX_DATASOURCE_USERNAME:outbox_worker}\n      password: ${OUTBOX_DATASOURCE_PASSWORD:}\n      hikari:\n        maximum-pool-size: 3\n        minimum-idle: 0\n        connection-timeout: 5000\n\n# --- Feature pack (mail, multipart, circuit breaker) ---\nspring.mail.host: ${SMTP_HOST:localhost}\nspring.mail.port: ${SMTP_PORT:1025}\nspring.mail.username: ${SMTP_USER:}\nspring.mail.password: ${SMTP_PASSWORD:}\nspring.mail.properties.mail.smtp.auth: false\nspring.mail.properties.mail.smtp.starttls.enable: false\nspring.servlet.multipart.max-file-size: 10MB\nspring.servlet.multipart.max-request-size: 10MB\n\nresilience4j.circuitbreaker.instances.smtp.registerHealthIndicator: true\nresilience4j.circuitbreaker.instances.smtp.slidingWindowSize: 10\nresilience4j.circuitbreaker.instances.smtp.minimumNumberOfCalls: 5\nresilience4j.circuitbreaker.instances.smtp.failureRateThreshold: 50\nresilience4j.circuitbreaker.instances.smtp.waitDurationInOpenState: 10s\n\n# Integración Procore (vacío = DRY-RUN explícito, no stub silencioso)\nintegration.procore.base-url: ${PROCORE_BASE_URL:}\nintegration.procore.token: ${PROCORE_TOKEN:}\n\nspring.web.resources.static-locations: classpath:/static/\napp.dev-seed: ${APP_DEV_SEED:false}