# Production management endpoints are isolated from the public HTTP listener.\n# Do not publish port 8081 at the host boundary; scrape from a private network only.\nmanagement:\n  server:\n    port: 8081\n  endpoints:\n    web:\n      exposure:\n        include: health,metrics,prometheus\n  endpoint:\n    health:\n      show-details: never\n\nlogging:\n  level:\n    com.tuempresa: INFO\n    org.camunda: WARN