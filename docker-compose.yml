services:\n  postgres:\n    image: postgres:16-alpine\n    environment:\n      POSTGRES_USER: ${POSTGRES_USER:-postgres}\n      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}\n      POSTGRES_DB: construction\n      APP_DB_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD must be set}\n      OUTBOX_DB_PASSWORD: ${OUTBOX_DB_PASSWORD:?OUTBOX_DB_PASSWORD must be set}\n    ports: ["5432:5432"]\n    volumes:\n      - ./docker/postgres:/docker-entrypoint-initdb.d:ro\n      - pgdata:/var/lib/postgresql/data\n    healthcheck:\n      test: ["CMD-SHELL", "pg_isready -U postgres -d construction"]\n      interval: 5s\n      timeout: 5s\n      retries: 10\n\n  # Runs with database-owner credentials in an isolated, short-lived container.\n  # Also repairs LOGIN/password attributes for existing volumes; initdb scripts alone cannot.\n  database-roles:\n    image: postgres:16-alpine\n    restart: "no"\n    entrypoint: ["/bin/sh", "-ec"]\n    command: |\n      until pg_isready -h postgres -U "$${POSTGRES_USER:-postgres}" -d construction; do sleep 1; done\n      PGPASSWORD="$${POSTGRES_PASSWORD}" psql -v ON_ERROR_STOP=1 -h postgres -U "$${POSTGRES_USER:-postgres}" -d construction \\n        --set=app_password="$${SPRING_DATASOURCE_PASSWORD}" \\n        --set=worker_password="$${OUTBOX_DB_PASSWORD}" <<'SQL'\n      DO $$\n      BEGIN\n        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'app_user') THEN\n          CREATE ROLE app_user WITH NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;\n        END IF;\n        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'outbox_worker') THEN\n          CREATE ROLE outbox_worker WITH NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;\n        END IF;\n      END $$;\n      ALTER ROLE app_user WITH LOGIN PASSWORD :'app_password' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;\n      ALTER ROLE outbox_worker WITH LOGIN PASSWORD :'worker_password' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;\n      GRANT CONNECT ON DATABASE construction TO app_user, outbox_worker;\n      GRANT USAGE ON SCHEMA public TO app_user, outbox_worker;\n      SQL\n    environment:\n      POSTGRES_USER: ${POSTGRES_USER:-postgres}\n      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}\n      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD must be set}\n      OUTBOX_DB_PASSWORD: ${OUTBOX_DB_PASSWORD:?OUTBOX_DB_PASSWORD must be set}\n    depends_on:\n      postgres:\n        condition: service_healthy\n\n  migrator:\n    build:\n      context: .\n      dockerfile: Dockerfile.migrator\n    restart: "no"\n    environment:\n      FLYWAY_URL: jdbc:postgresql://postgres:5432/construction\n      FLYWAY_USER: ${POSTGRES_USER:-postgres}\n      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}\n    depends_on:\n      database-roles:\n        condition: service_completed_successfully\n\n  app:\n    build: .\n    environment:\n      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/construction\n      SPRING_DATASOURCE_USERNAME: app_user\n      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD must be set}\n      SPRING_FLYWAY_ENABLED: "false"\n      EVIDENCE_HMAC_KEY: ${EVIDENCE_HMAC_KEY:?EVIDENCE_HMAC_KEY must be set}\n      CONSTRUCTION_BOOTSTRAP_TOKEN: ${CONSTRUCTION_BOOTSTRAP_TOKEN:?CONSTRUCTION_BOOTSTRAP_TOKEN must be set}\n      ALLOW_X_USER_ID: "false"\n      OUTBOX_WORKER_ENABLED: "true"\n      OUTBOX_DATASOURCE_URL: jdbc:postgresql://postgres:5432/construction\n      OUTBOX_DATASOURCE_USERNAME: outbox_worker\n      OUTBOX_DATASOURCE_PASSWORD: ${OUTBOX_DB_PASSWORD:?OUTBOX_DB_PASSWORD must be set}\n    ports: ["8080:8080"]\n    depends_on:\n      migrator:\n        condition: service_completed_successfully\n\nvolumes:\n  pgdata: